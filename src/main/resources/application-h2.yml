spring:
  application:
    name: trustpay-backend
  datasource:
    url: jdbc:h2:mem:trustpay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

trustpay:
  tesseract:
    datapath: ${TRUSTPAY_TESSERACT_DATAPATH:/usr/share/tesseract-ocr/4.00/tessdata}
